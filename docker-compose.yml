# Production stack: web app, realtime server and HTTPS proxy on one machine.
# Needs DOMAIN in the environment (see docs/deploy.md).
x-app: &app
  image: ${IMAGE:-ghcr.io/tyavorska/tennismate:latest}
  restart: unless-stopped
  environment:
    DATABASE_PATH: /app/data/tennismate.db
    REALTIME_ALLOWED_ORIGIN: https://${DOMAIN}
  volumes:
    - app-data:/app/data

services:
  web:
    <<: *app
    command: ['npm', 'start']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  realtime:
    <<: *app
    command: ['npm', 'run', 'realtime']
    environment:
      DATABASE_PATH: /app/data/tennismate.db
      REALTIME_ALLOWED_ORIGIN: https://${DOMAIN}
      REALTIME_PORT: '4000'

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - web
      - realtime

volumes:
  app-data:
  caddy-data:
